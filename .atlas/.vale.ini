# Vale prose Lint for this Atlas. Atlas SDK runs its pinned Vale with this
# file on every Lint; an error-level alert fails Lint. This Atlas owns this
# configuration and may change, disable, or extend any rule.
StylesPath = vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = AtlasSDK, Google
# Ingest writes verbatim source quotations as `Quoted span "exact text".`,
# which Google.Quotes would reject; keep it advisory.
Google.Quotes = warning
