name: Council - Fletcher

on:
  pull_request_target:
    paths:
      - ".cacophony/agents/**"
      - ".cacophony/compositions.json"
      - ".cacophony/directives/**"
      - ".cacophony/personas/**"
      - "docs/agents/atlas-sdk/**"
      - "scripts/atlas_sdk_agents.ts"
      - "scripts/cacophony_agents.ts"
      - "scripts/run_actionlint.ts"
      - "tests/atlas_sdk_agents.test.ts"
      - "tests/cacophony_agents.test.ts"
      - ".npmrc"
      - "eslint.config.js"
      - "package-lock.json"
      - "package.json"
      - "prettier.config.js"
      - "tsconfig.json"
      - ".github/workflows/cacophony-review.yml"
      - ".github/workflows/council-fletcher.yml"
      - ".github/workflows/dragon-council.yml"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prompt-contract:
    name: Deterministic prompt contract
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current pull request revision
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in {1..12}; do
            pull_request="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            base_sha="$(jq -r '.base.sha // empty' <<< "$pull_request")"
            merge_sha="$(jq -r '.merge_commit_sha // empty' <<< "$pull_request")"
            if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
              {
                echo "base_sha=$base_sha"
                echo "merge_sha=$merge_sha"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Merge revision is not ready (attempt $attempt of 12)."
            sleep 5
          done
          echo "::error::GitHub did not produce a current pull request merge revision."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.revision.outputs.merge_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0

      - name: Validate changed prompt contract with trusted rules
        shell: bash
        env:
          BASE_SHA: ${{ steps.revision.outputs.base_sha }}
          MERGE_SHA: ${{ steps.revision.outputs.merge_sha }}
        run: |
          validator="$RUNNER_TEMP/cacophony_agents.ts"
          git show "$BASE_SHA:scripts/cacophony_agents.ts" > "$validator"
          chmod 0555 "$validator"
          node "$validator" verify-revision \
            --repository "$GITHUB_WORKSPACE" \
            --revision "$MERGE_SHA" \
            --agent fletcher

  prompt-review:
    needs: prompt-contract
    uses: ./.github/workflows/cacophony-review.yml
    with:
      agent-slug: fletcher
      deployment: gpt-5.6-luna
      max-turns: 40
      timeout-seconds: 1200
      fail-on: high
    secrets:
      azure-api-key: ${{ secrets.CACOPHONY_AZURE_API_KEY }}
