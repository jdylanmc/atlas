name: Council - Fletcher

on:
  pull_request_target:
    paths:
      - ".cacophony/agents/**"
      - ".cacophony/directives/**"
      - ".cacophony/personas/**"
      - "scripts/cacophony_agents.py"
      - "tests/test_cacophony_agents.py"
      - ".github/workflows/cacophony-review.yml"
      - ".github/workflows/council-fletcher.yml"
      - ".github/workflows/dragon-council.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prompt-contract:
    name: Deterministic prompt contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate changed prompt contract with trusted rules
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if git cat-file -e "$BASE_SHA:scripts/cacophony_agents.py"; then
            validator="$RUNNER_TEMP/cacophony_agents.py"
            git show "$BASE_SHA:scripts/cacophony_agents.py" > "$validator"
            python3 "$validator" verify-revision \
              --repository "$GITHUB_WORKSPACE" \
              --revision "$MERGE_SHA" \
              --agent fletcher
          elif git cat-file -e "$BASE_SHA:.cacophony/agents/fletcher.md"; then
            echo "::notice::Validator bootstrap detected; the trusted base has only the legacy Fletcher prompt."
          else
            echo "::error::Neither the trusted validator nor legacy Fletcher prompt exists."
            exit 1
          fi

  prompt-review:
    needs: prompt-contract
    uses: ./.github/workflows/cacophony-review.yml
    with:
      agent-slug: fletcher
      deployment: gpt-5.6-luna
      max-turns: 40
      timeout-seconds: 1200
      fail-on: high
    secrets:
      azure-api-key: ${{ secrets.CACOPHONY_AZURE_API_KEY }}
