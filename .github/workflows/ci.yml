name: CI

# The deterministic gate. ADR-0001 keeps the Atlas SDK free of model calls, so
# this workflow needs no API key, no credits, and no secrets: it is the half of
# verification that must stay runnable when the Cacophony council cannot run.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Resolve every dependency from the public registry. The committed
      # lockfile must never bind this project to a private mirror.
      npm_config_registry: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0

      - name: Record toolchain versions
        run: |
          node --version
          npm --version

      - name: Install dependencies reproducibly
        run: npm ci --ignore-scripts

      - name: Run the complete repository gate
        run: npm run ci
