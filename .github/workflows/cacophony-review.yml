name: Reusable Cacophony Review

on:
  workflow_call:
    inputs:
      agent-slug:
        required: true
        type: string
      deployment:
        required: true
        type: string
      max-turns:
        required: false
        type: number
        default: 20
      timeout-seconds:
        required: false
        type: number
        default: 600
      evidence-artifact:
        required: false
        type: string
        default: ""
      evidence-files:
        required: false
        type: string
        default: ""
      fail-on:
        required: false
        type: string
        default: high
    secrets:
      azure-api-key:
        required: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      CACOPHONY_AZURE_ENDPOINT: ${{ vars.CACOPHONY_AZURE_ENDPOINT }}
    steps:
      - name: Authorize trusted-base review
        shell: bash
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request_target" ]]; then
            echo "::error::Cacophony reviews require a pull_request_target caller."
            exit 1
          fi

          if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "::error::Cacophony reviews do not execute for fork pull requests."
            exit 1
          fi

      - name: Resolve current pull request revision
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in {1..12}; do
            pull_request="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            base_sha="$(jq -r '.base.sha // empty' <<< "$pull_request")"
            merge_sha="$(jq -r '.merge_commit_sha // empty' <<< "$pull_request")"
            if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
              {
                echo "base_sha=$base_sha"
                echo "merge_sha=$merge_sha"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Merge revision is not ready (attempt $attempt of 12)."
            sleep 5
          done
          echo "::error::GitHub did not produce a current pull request merge revision."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.revision.outputs.merge_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0

      - name: Verify and stage trusted prompt composition
        shell: bash
        env:
          AGENT_SLUG: ${{ inputs.agent-slug }}
          BASE_SHA: ${{ steps.revision.outputs.base_sha }}
        run: |
          if [[ ! "$AGENT_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Invalid agent slug."
            exit 1
          fi

          prompt_path=".cacophony/agents/$AGENT_SLUG.md"
          if git cat-file -e "$BASE_SHA:scripts/cacophony_agents.ts"; then
            validator="$RUNNER_TEMP/cacophony_agents.ts"
            git show "$BASE_SHA:scripts/cacophony_agents.ts" > "$validator"
            chmod 0555 "$validator"
            node "$validator" verify-revision \
              --repository "$GITHUB_WORKSPACE" \
              --revision "$BASE_SHA" \
              --agent "$AGENT_SLUG"
          else
            if git cat-file -e "$BASE_SHA:scripts/cacophony_agents.py"; then
              echo "::notice::Using the legacy trusted-base prompt bootstrap; the base predates the TypeScript validator and no Python code is executed."
            else
              echo "::notice::Using the legacy trusted-base prompt bootstrap; no pull request validator is executed."
            fi
            prompt_type="$(git ls-tree "$BASE_SHA" -- "$prompt_path" | awk '{print $1 " " $2}')"
            prompt_bytes="$(git cat-file -s "$BASE_SHA:$prompt_path")"
            if [[ "$prompt_type" != "100644 blob" ]] ||
              [[ ! "$prompt_bytes" =~ ^[0-9]+$ ]] ||
              (( prompt_bytes > 131072 )); then
              echo "::error::Legacy trusted-base prompt is missing, invalid, or oversized."
              exit 1
            fi
          fi

          workspace_root="$(realpath "$GITHUB_WORKSPACE")"
          agents_root="$(realpath .cacophony/agents)"
          if [[ -L .cacophony/agents || "$agents_root" != "$workspace_root/.cacophony/agents" ]]; then
            echo "::error::.cacophony/agents is not the expected workspace directory."
            exit 1
          fi

          trusted_prompt="$RUNNER_TEMP/$AGENT_SLUG.md"
          git show "$BASE_SHA:$prompt_path" > "$trusted_prompt"
          rm -f "$prompt_path"
          install -m 0644 "$trusted_prompt" "$prompt_path"
          cmp --silent "$trusted_prompt" "$prompt_path"
          sha256sum "$prompt_path"

      - name: Prepare evidence directory
        if: inputs.evidence-artifact != ''
        shell: bash
        run: |
          rm -rf .cacophony/evidence
          mkdir -p .cacophony/evidence

      - name: Download deterministic evidence
        if: inputs.evidence-artifact != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.evidence-artifact }}
          path: .cacophony/evidence

      - name: Run Cacophony review
        id: review
        uses: jdylanmc/cacophony@ee9525ab23d654cf67172e178a5ab885f352c0d3
        with:
          # The pinned action independently reads this path from the base SHA;
          # the preceding step also binds its workspace copy to those bytes.
          prompt-file: .cacophony/agents/${{ inputs.agent-slug }}.md
          evidence-files: ${{ inputs.evidence-files }}
          endpoint: ${{ env.CACOPHONY_AZURE_ENDPOINT }}
          deployment: ${{ inputs.deployment }}
          max-turns: ${{ inputs.max-turns }}
          timeout-seconds: ${{ inputs.timeout-seconds }}
          rate-limit-retries: 2
          fail-on: ${{ inputs.fail-on }}
        env:
          CACOPHONY_AZURE_API_KEY: ${{ secrets.azure-api-key }}

      - name: Stage validated Cacophony report
        if: always() && steps.review.outcome != 'skipped'
        shell: bash
        env:
          AGENT_SLUG: ${{ inputs.agent-slug }}
        run: |
          source_root="$GITHUB_WORKSPACE/.cacophony/out/$AGENT_SLUG"
          workspace_root="$(realpath "$GITHUB_WORKSPACE")"

          if [[ ! -d "$source_root" || -L "$source_root" ]]; then
            echo "::error::Cacophony report directory is missing or is a symbolic link."
            exit 1
          fi

          source_root="$(realpath "$source_root")"
          case "$source_root" in
            "$workspace_root"/.cacophony/out/*) ;;
            *)
              echo "::error::Cacophony report directory escapes the workspace."
              exit 1
              ;;
          esac

          destination="$RUNNER_TEMP/cacophony-report/$AGENT_SLUG"
          mkdir -p "$destination"
          for report in report.json report.md; do
            source_file="$source_root/$report"
            if [[ ! -f "$source_file" || -L "$source_file" ]]; then
              echo "::error::$report is missing, not regular, or is a symbolic link."
              exit 1
            fi
            resolved="$(realpath "$source_file")"
            case "$resolved" in
              "$source_root"/*) ;;
              *)
                echo "::error::$report escapes the validated report directory."
                exit 1
                ;;
            esac
            install -m 0644 "$resolved" "$destination/$report"
          done

      - name: Upload staged Cacophony report
        if: always() && steps.review.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cacophony-${{ inputs.agent-slug }}
          path: ${{ runner.temp }}/cacophony-report/${{ inputs.agent-slug }}/
          if-no-files-found: error
