name: Dragon Council

on:
  pull_request_target:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize council resources
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.revision.outputs.base_sha }}
      head_sha: ${{ steps.revision.outputs.head_sha }}
      merge_sha: ${{ steps.revision.outputs.merge_sha }}
    steps:
      - name: Check pull request trust
        shell: bash
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "::error::The Dragon Council does not execute for fork pull requests."
            exit 1
          fi

      - name: Resolve current pull request revision
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in {1..12}; do
            pull_request="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
            base_sha="$(jq -r '.base.sha // empty' <<< "$pull_request")"
            head_sha="$(jq -r '.head.sha // empty' <<< "$pull_request")"
            merge_sha="$(jq -r '.merge_commit_sha // empty' <<< "$pull_request")"
            if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
              {
                echo "base_sha=$base_sha"
                echo "head_sha=$head_sha"
                echo "merge_sha=$merge_sha"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::Merge revision is not ready (attempt $attempt of 12)."
            sleep 5
          done
          echo "::error::GitHub did not produce a current pull request merge revision."
          exit 1

  static-analysis:
    name: Static analysis
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      actionlint: ${{ steps.result.outputs.actionlint }}
      codeql: ${{ steps.result.outputs.codeql }}
      passed: ${{ steps.result.outputs.passed }}
      prompt_contract: ${{ steps.result.outputs.prompt_contract }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.authorize.outputs.merge_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0

      - name: Prepare static-analysis evidence
        shell: bash
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          MERGE_SHA: ${{ needs.authorize.outputs.merge_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/council-evidence"
          touch "$RUNNER_TEMP/council-evidence/actionlint.log"
          touch "$RUNNER_TEMP/council-evidence/prompt-contract.log"
          printf '{"version":"2.1.0","runs":[]}\n' > "$RUNNER_TEMP/council-evidence/codeql.sarif"
          jq -n \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            --arg merge "$MERGE_SHA" \
            '{baseSha:$base,headSha:$head,mergeSha:$merge}' \
            > "$RUNNER_TEMP/council-evidence/revision.json"

      - name: Validate GitHub Actions workflows
        id: actionlint
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
        run: |
          set -o pipefail
          if git cat-file -e "$BASE_SHA:scripts/run_actionlint.ts"; then
            runner="$RUNNER_TEMP/run_actionlint.ts"
            git show "$BASE_SHA:scripts/run_actionlint.ts" > "$runner"
            chmod 0555 "$runner"
            ATLAS_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
              ATLAS_TOOL_CACHE="$RUNNER_TEMP/atlas-tools" \
              node "$runner" 2>&1 |
              tee "$RUNNER_TEMP/council-evidence/actionlint.log"
          else
            archive="$RUNNER_TEMP/actionlint.tar.gz"
            curl --fail --location --silent --show-error \
              --output "$archive" \
              https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
            echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" |
              sha256sum --check
            tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
            "$RUNNER_TEMP/actionlint" -pyflakes "" 2>&1 |
              tee "$RUNNER_TEMP/council-evidence/actionlint.log"
          fi

      - name: Validate Cacophony agent prompt contract
        id: prompt-contract
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          MERGE_SHA: ${{ needs.authorize.outputs.merge_sha }}
        run: |
          set -o pipefail
          if git cat-file -e "$BASE_SHA:scripts/cacophony_agents.ts"; then
            validator="$RUNNER_TEMP/cacophony_agents.ts"
            git show "$BASE_SHA:scripts/cacophony_agents.ts" > "$validator"
            chmod 0555 "$validator"
            node "$validator" verify-revision \
              --repository "$GITHUB_WORKSPACE" \
              --revision "$MERGE_SHA" \
              --agent fletcher 2>&1 |
              tee "$RUNNER_TEMP/council-evidence/prompt-contract.log"
          else
            if git cat-file -e "$BASE_SHA:scripts/cacophony_agents.py"; then
              echo "::notice::The trusted base predates the TypeScript validator; validating only its existing prompt blobs."
            fi
            for agent in balerion bolas fletcher smaug; do
              prompt_path=".cacophony/agents/$agent.md"
              prompt_type="$(git ls-tree "$BASE_SHA" -- "$prompt_path" | awk '{print $1 " " $2}')"
              prompt_bytes="$(git cat-file -s "$BASE_SHA:$prompt_path")"
              if [[ "$prompt_type" != "100644 blob" ]] ||
                [[ ! "$prompt_bytes" =~ ^[0-9]+$ ]] ||
                (( prompt_bytes > 131072 )); then
                echo "::error::Legacy trusted-base prompt is missing, invalid, or oversized: $prompt_path"
                exit 1
              fi
            done
            echo "Legacy trusted-base prompt bootstrap validated; no pull request validator was executed." |
              tee "$RUNNER_TEMP/council-evidence/prompt-contract.log"
          fi

      - name: Detect JavaScript or TypeScript sources
        id: sources
        shell: bash
        run: |
          if find . -type f \
            \( -name '*.cjs' -o -name '*.cts' -o -name '*.js' -o -name '*.jsx' \
            -o -name '*.mjs' -o -name '*.mts' -o -name '*.ts' -o -name '*.tsx' \) \
            -not -path './.git/*' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        id: codeql-init
        if: steps.sources.outputs.present == 'true'
        continue-on-error: true
        uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze with CodeQL
        id: codeql
        if: steps.sources.outputs.present == 'true' && steps.codeql-init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-results

      - name: Normalize static-analysis evidence
        id: result
        if: always()
        shell: bash
        env:
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          CODEQL_INIT_OUTCOME: ${{ steps.codeql-init.outcome }}
          CODEQL_OUTCOME: ${{ steps.codeql.outcome }}
          PROMPT_CONTRACT_OUTCOME: ${{ steps.prompt-contract.outcome }}
          SOURCES_PRESENT: ${{ steps.sources.outputs.present }}
          SARIF_DIRECTORY: ${{ steps.codeql.outputs.sarif-output }}
        run: |
          actionlint="$ACTIONLINT_OUTCOME"
          prompt_contract="$PROMPT_CONTRACT_OUTCOME"
          if [[ "$SOURCES_PRESENT" != "true" ]]; then
            codeql=skipped
          elif [[ "$CODEQL_INIT_OUTCOME" != "success" || "$CODEQL_OUTCOME" != "success" ]]; then
            codeql=failure
          else
            codeql=success
            mapfile -t sarif_files < <(find "$SARIF_DIRECTORY" -type f -name '*.sarif' -print)
            if [[ "${#sarif_files[@]}" -eq 1 ]]; then
              cp "${sarif_files[0]}" "$RUNNER_TEMP/council-evidence/codeql.sarif"
            else
              codeql=failure
            fi
          fi

          printf '{"tool":"actionlint","outcome":"%s"}\n' "$actionlint" > "$RUNNER_TEMP/council-evidence/actionlint.status.json"
          printf '{"tool":"codeql","outcome":"%s"}\n' "$codeql" > "$RUNNER_TEMP/council-evidence/codeql.status.json"
          printf '{"tool":"agent-prompt-contract","outcome":"%s"}\n' "$prompt_contract" > "$RUNNER_TEMP/council-evidence/prompt-contract.status.json"
          if [[ "$actionlint" == "success" ]] &&
            [[ "$codeql" == "success" || "$codeql" == "skipped" ]] &&
            [[ "$prompt_contract" == "success" ]]; then
            passed=true
          else
            passed=false
          fi
          {
            printf 'actionlint=%s\ncodeql=%s\nprompt_contract=%s\n' \
              "$actionlint" "$codeql" "$prompt_contract"
            echo "passed=$passed"
          } >> "$GITHUB_OUTPUT"

      - name: Upload static-analysis evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dragon-static-analysis
          path: ${{ runner.temp }}/council-evidence/
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      manifest: ${{ steps.manifest.outcome }}
      outcome: ${{ steps.result.outputs.outcome }}
      passed: ${{ steps.result.outputs.passed }}
      tests: ${{ steps.manifest.outputs.tests }}
      unit: ${{ steps.unit.outcome }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.authorize.outputs.merge_sha }}
          persist-credentials: false

      - name: Inspect package test contract
        id: manifest
        continue-on-error: true
        shell: bash
        run: |
          if [[ ! -f package.json ]]; then
            echo "tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -e . package.json > /dev/null
          jq -r '
            if (.scripts.test? | type == "string" and length > 0)
            then "tests=true"
            else "tests=false"
            end
          ' package.json >> "$GITHUB_OUTPUT"

      - name: Install dependencies and run unit tests
        id: unit
        if: steps.manifest.outcome == 'success' && steps.manifest.outputs.tests == 'true'
        continue-on-error: true
        shell: bash
        run: |
          docker run --rm \
            --cpus 2 \
            --memory 2g \
            --pids-limit 256 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            --tmpfs /workspace:rw,exec,nosuid,size=1g,mode=1777 \
            --env HOME=/tmp \
            --env npm_config_cache=/tmp/npm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --workdir /workspace \
            node:24.13.0-bookworm-slim@sha256:4660b1ca8b28d6d1906fd644abe34b2ed81d15434d26d845ef0aced307cf4b6f \
            sh -euc 'cp -a /source/. /workspace/ && npm ci --ignore-scripts && npm run ci'

      - name: Normalize unit-test result
        id: result
        if: always()
        shell: bash
        env:
          MANIFEST: ${{ steps.manifest.outcome }}
          TESTS_PRESENT: ${{ steps.manifest.outputs.tests }}
          UNIT: ${{ steps.unit.outcome }}
        run: |
          if [[ "$MANIFEST" != "success" ]]; then
            outcome=invalid-package-manifest
          elif [[ "$TESTS_PRESENT" != "true" ]]; then
            outcome=skipped
          else
            outcome="$UNIT"
          fi
          if [[ "$outcome" == "success" || "$outcome" == "skipped" ]]; then
            passed=true
          else
            passed=false
          fi
          {
            echo "outcome=$outcome"
            echo "passed=$passed"
          } >> "$GITHUB_OUTPUT"

  collect-evidence:
    name: Collect council evidence
    if: always() && needs.authorize.result == 'success'
    needs:
      - authorize
      - static-analysis
      - unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dragon-static-analysis
          path: council-evidence

      - name: Record unit-test result
        id: result
        shell: bash
        env:
          TEST_OUTCOME: ${{ needs.unit-tests.outputs.outcome }}
        run: |
          printf '{"tool":"unit-tests","outcome":"%s"}\n' "$TEST_OUTCOME" > council-evidence/unit-tests.status.json

      - name: Upload complete council evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dragon-council-evidence
          path: council-evidence/
          if-no-files-found: error

  deterministic-verification:
    name: Deterministic verification
    if: always()
    needs:
      - authorize
      - static-analysis
      - unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Enforce static analysis and unit tests
        env:
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          STATIC_ANALYSIS_PASSED: ${{ needs.static-analysis.outputs.passed }}
          STATIC_ANALYSIS_RESULT: ${{ needs.static-analysis.result }}
          UNIT_TESTS_PASSED: ${{ needs.unit-tests.outputs.passed }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
        run: |
          test "$AUTHORIZE_RESULT" = "success"
          test "$STATIC_ANALYSIS_RESULT" = "success"
          test "$UNIT_TESTS_RESULT" = "success"
          test "$STATIC_ANALYSIS_PASSED" = "true"
          test "$UNIT_TESTS_PASSED" = "true"

  bolas:
    name: Bolas
    needs: collect-evidence
    uses: ./.github/workflows/cacophony-review.yml
    with:
      agent-slug: bolas
      evidence-artifact: dragon-council-evidence
      evidence-files: |
        .cacophony/evidence/actionlint.status.json
        .cacophony/evidence/actionlint.log
        .cacophony/evidence/codeql.status.json
        .cacophony/evidence/codeql.sarif
        .cacophony/evidence/prompt-contract.status.json
        .cacophony/evidence/prompt-contract.log
        .cacophony/evidence/revision.json
        .cacophony/evidence/unit-tests.status.json
      deployment: gpt-5.6-luna
      max-turns: 30
      fail-on: high
    secrets:
      azure-api-key: ${{ secrets.CACOPHONY_AZURE_API_KEY }}

  smaug:
    name: Smaug
    needs: collect-evidence
    uses: ./.github/workflows/cacophony-review.yml
    with:
      agent-slug: smaug
      evidence-artifact: dragon-council-evidence
      evidence-files: |
        .cacophony/evidence/actionlint.status.json
        .cacophony/evidence/actionlint.log
        .cacophony/evidence/codeql.status.json
        .cacophony/evidence/codeql.sarif
        .cacophony/evidence/prompt-contract.status.json
        .cacophony/evidence/prompt-contract.log
        .cacophony/evidence/revision.json
        .cacophony/evidence/unit-tests.status.json
      deployment: gpt-5.6-luna
      max-turns: 30
      fail-on: high
    secrets:
      azure-api-key: ${{ secrets.CACOPHONY_AZURE_API_KEY }}

  balerion:
    name: Balerion
    needs: collect-evidence
    uses: ./.github/workflows/cacophony-review.yml
    with:
      agent-slug: balerion
      evidence-artifact: dragon-council-evidence
      evidence-files: |
        .cacophony/evidence/actionlint.status.json
        .cacophony/evidence/actionlint.log
        .cacophony/evidence/codeql.status.json
        .cacophony/evidence/codeql.sarif
        .cacophony/evidence/prompt-contract.status.json
        .cacophony/evidence/prompt-contract.log
        .cacophony/evidence/revision.json
        .cacophony/evidence/unit-tests.status.json
      deployment: gpt-5.6-luna
      max-turns: 30
      fail-on: high
    secrets:
      azure-api-key: ${{ secrets.CACOPHONY_AZURE_API_KEY }}

  council-gate:
    name: Council gate
    if: always()
    needs:
      - collect-evidence
      - deterministic-verification
      - bolas
      - smaug
      - balerion
    runs-on: ubuntu-latest
    steps:
      - name: Require complete council execution
        shell: bash
        env:
          BALERION: ${{ needs.balerion.result }}
          BOLAS: ${{ needs.bolas.result }}
          COLLECT_EVIDENCE: ${{ needs.collect-evidence.result }}
          DETERMINISTIC_VERIFICATION: ${{ needs.deterministic-verification.result }}
          SMAUG: ${{ needs.smaug.result }}
        run: |
          test "$COLLECT_EVIDENCE" = "success"
          test "$DETERMINISTIC_VERIFICATION" = "success"
          test "$BOLAS" = "success"
          test "$SMAUG" = "success"
          test "$BALERION" = "success"
